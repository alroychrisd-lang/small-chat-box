
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMALL AI | Futuristic Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080D18;
    color: #EAF6FF;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* APP LAYOUT */
.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #0B1422;
    border-right: 1px solid #19354A;
    padding: 22px 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #42E8FF;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.logo span {
    color: white;
}

.version {
    color: #6B8DA3;
    font-size: 11px;
    margin-bottom: 30px;
}

.new-chat {
    background: #102D42;
    color: #42E8FF;
    border: 1px solid #23617C;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 25px;
}

.new-chat:hover {
    background: #17435C;
}

.side-heading {
    color: #63849A;
    font-size: 11px;
    margin-bottom: 12px;
}

.history {
    overflow-y: auto;
    flex: 1;
}

.history-item {
    padding: 11px;
    color: #A8C0D1;
    font-size: 13px;
    border-radius: 7px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-item:hover {
    background: #142A3B;
    color: #42E8FF;
}

.sidebar-bottom {
    border-top: 1px solid #19354A;
    padding-top: 15px;
    color: #7895A8;
    font-size: 12px;
    line-height: 2;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* TOPBAR */
.topbar {
    height: 65px;
    background: #0B1422;
    border-bottom: 1px solid #19354A;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.status {
    color: #35E6A5;
    font-size: 12px;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #35E6A5;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 10px #35E6A5;
}

.clear-btn {
    background: transparent;
    border: 1px solid #29445A;
    color: #A7C0D1;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

/* CHAT AREA */
.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px 7%;
    scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar,
.history::-webkit-scrollbar {
    width: 6px;
}

.chat-area::-webkit-scrollbar-thumb,
.history::-webkit-scrollbar-thumb {
    background: #22516C;
    border-radius: 10px;
}

/* WELCOME */
.welcome {
    text-align: center;
    margin: 50px auto 30px;
}

.ai-icon {
    width: 90px;
    height: 90px;
    margin: auto auto 22px;
    border-radius: 50%;
    border: 2px solid #25D9FF;
    background: #102B40;
    display: grid;
    place-items: center;
    font-size: 42px;
    box-shadow: 0 0 30px #087FA555;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: #42E8FF;
}

.welcome p {
    color: #7D9CB0;
    font-size: 14px;
}

/* QUICK PROMPTS */
.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}

.suggestion {
    background: #101F30;
    color: #B9D8E9;
    border: 1px solid #24465F;
    border-radius: 20px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 12px;
}

.suggestion:hover {
    border-color: #42E8FF;
    color: #42E8FF;
}

/* MESSAGES */
.message {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    animation: appear .25s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(8px);}
    to {opacity: 1; transform: translateY(0);}
}

.avatar {
    min-width: 36px;
    height: 36px;
    background: #12354B;
    border: 1px solid #24708E;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #42E8FF;
    font-size: 15px;
}

.message-content {
    max-width: 85%;
    min-width: 0;
}

.sender {
    color: #42E8FF;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
}

.message-text {
    color: #DCEBF5;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    flex-direction: row-reverse;
}

.user-message .avatar {
    background: #153951;
    color: #FFFFFF;
}

.user-message .message-content {
    text-align: right;
}

.user-message .sender {
    color: #A8CFFF;
}

/* TYPING */
.typing {
    color: #42E8FF;
    font-size: 12px;
    padding: 10px 0;
}

/* INPUT */
.input-section {
    padding: 15px 7% 22px;
    background: #0B1422;
    border-top: 1px solid #19354A;
}

.input-box {
    display: flex;
    gap: 10px;
    background: #101F30;
    border: 1px solid #28516B;
    border-radius: 14px;
    padding: 8px;
    transition: .2s;
}

.input-box:focus-within {
    border-color: #42E8FF;
    box-shadow: 0 0 15px #42E8FF22;
}

.input-box input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 14px;
    padding: 12px;
}

.input-box input::placeholder {
    color: #68879B;
}

.send-btn {
    background: #087FA5;
    border: none;
    color: white;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
    font-weight: bold;
}

.send-btn:hover {
    background: #10A4CB;
}

.footer {
    text-align: center;
    color: #577589;
    font-size: 10px;
    margin-top: 12px;
}

/* MOBILE */
@media(max-width: 700px) {
    .sidebar {
        display: none;
    }

    .chat-area {
        padding: 20px 15px;
    }

    .input-section {
        padding: 12px;
    }

    .welcome h1 {
        font-size: 23px;
    }

    .topbar {
        padding: 0 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">✦ SMALL <span>AI</span></div>
        <div class="version">INTELLIGENCE SYSTEM 2.0</div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="side-heading">RECENT CONVERSATIONS</div>

        <div class="history" id="history"></div>

        <div class="sidebar-bottom">
            ◈ Rule-Based Engine<br>

            ◈ Version 2.0.0

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <div>

                <div class="status">

                </div>
            </div>

            <button class="clear-btn" onclick="clearChat()">
                Clear Chat
            </button>
        </header>

        <!-- CHAT -->
        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">

                <div class="ai-icon">✦</div>

                <h1>How can I <span>help you?</span></h1>

                <p>Your personal rule-based AI assistant.</p>

                <div class="suggestions">

                    <button class="suggestion"
                        onclick="quickSend('hi')">
                        Say Hello
                    </button>

                    <button class="suggestion"
                        onclick="quickSend('what is python')">
                        Learn Python
                    </button>

                    <button class="suggestion"
                        onclick="quickSend('help')">
                        Help
                    </button>

                    <button class="suggestion"
                        onclick="quickSend('who are you')">
                        About AI
                    </button>

                </div>

            </div>

        </section>

        <!-- INPUT -->
        <footer class="input-section">

            <div class="input-box">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Message SMALL AI..."
                    autocomplete="off"
                >

                <button class="send-btn" onclick="sendMessage()">
                    ➤ SEND
                </button>

            </div>

            <div class="footer">
                SMALL AI can make mistakes. Verify important information.
            </div>

        </footer>

    </main>

</div>

// ===================================
// ELEMENTS
// ===================================

const chatArea = document.getElementById("chatArea");
const input = document.getElementById("userInput");
const history = document.getElementById("history");
const welcome = document.getElementById("welcome");

let conversation = [];

// ===================================
// DISPLAY MESSAGE
// ===================================

function displayMessage(text, sender) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");
    message.className = "message " +
        (sender === "user" ? "user-message" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = sender === "user" ? "U" : "✦";

    const content = document.createElement("div");
    content.className = "message-content";

    const name = document.createElement("div");
    name.className = "sender";
    name.textContent = sender === "user" ? "YOU" : "SMALL AI";

    const textElement = document.createElement("div");
    textElement.className = "message-text";
    textElement.textContent = text;

    const time = document.createElement("div");
    time.style.color = "#607F94";
    time.style.fontSize = "10px";
    time.style.marginTop = "7px";
    time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    content.appendChild(name);
    content.appendChild(textElement);
    content.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(content);

    chatArea.appendChild(message);

    chatArea.scrollTop = chatArea.scrollHeight;

    conversation.push({
        text: text,
        sender: sender
    });
}

// ===================================
// TYPING ANIMATION
// ===================================

function showTyping() {

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.textContent = "SMALL AI is thinking...";

    chatArea.appendChild(typing);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
}

// ===================================
// CHATBOT RESPONSE ENGINE
// ===================================

function react(user) {

    let found = false;

    for (let item of responses) {

        const separator = item.indexOf("|");

        const key = item.substring(0, separator).toLowerCase();
        const answer = item.substring(separator + 1);

        if (user === key || user === key + " for") {

            displayMessage(answer, "bot");
            found = true;
            break;
        }
    }

    if (!found) {

        displayMessage(
            "Sorry, I don't understand that question yet. Try asking something else or type 'help'.",
            "bot"
        );
    }
}

// ===================================
// SEND MESSAGE
// ===================================

function sendMessage() {

    const user = input.value.trim();

    if (!user) return;

    displayMessage(user, "user");

    input.value = "";
    input.disabled = true;

    showTyping();

    setTimeout(() => {

        removeTyping();
        react(user);

        input.disabled = false;
        input.focus();

    }, 500);
}

// ===================================
// QUICK PROMPTS
// ===================================

function quickSend(text) {

    input.value = text;
    sendMessage();

}

// ===================================
// CLEAR CHAT
// ===================================

function clearChat() {

    chatArea.innerHTML = "";

    conversation = [];

    if (welcome) {
        chatArea.appendChild(welcome);
        welcome.style.display = "block";
    }

}

// ===================================
// NEW CHAT
// ===================================

function newChat() {

    clearChat();
    input.value = "";
    input.focus();

}

// ===================================
// CHAT HISTORY
// ===================================

function updateHistory() {

    const historyItem = document.createElement("div");

    historyItem.className = "history-item";

    historyItem.textContent =
        conversation.length > 0
        ? conversation[0].text
        : "New conversation";

    historyItem.title = historyItem.textContent;

    history.prepend(historyItem);

}

// ===================================
// KEYBOARD
// ===================================

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

// ===================================
// STARTUP
// ===================================

console.log("SMALL AI 2.0 started successfully!");

</script>
